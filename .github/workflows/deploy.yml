name: Deploy Next.js to Server

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 5m
          script: |
            cd /termin/test_termin/termin_calender
            git stash
            git pull 
            npm install 
            npm run build -- --webpack
            pm2 delete test-termin-frontend || true
            PORT=4501 pm2 start /termin/test_termin/termin_calender/node_modules/next/dist/bin/next --name "test-termin-frontend" -- start
            pm2 save